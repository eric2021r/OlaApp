name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar a release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0-build${GITHUB_RUN_NUMBER}"
          fi
          echo "Publicando a release $TAG"
          NOTES="APK de depuracao (debug) gerado automaticamente pelo GitHub Actions. Baixe o app-debug.apk e instale no celular (permita instalar apps de fontes desconhecidas). Conteudo: Contador, Calculadora, Aventura da Espada (2D) e Coliseu do Eric (3D) com o menu de lutadores - Cavaleiro, Lutador e Assassino - alem de moedas e niveis."
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Coliseu do Eric - $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
